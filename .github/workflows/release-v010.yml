name: Publish v0.1.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v010.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Build and verify release
        run: |
          grep -q "versionCode = 1" app/build.gradle
          grep -q "versionName = '0.1.0'" app/build.gradle
          grep -q 'targetApiVersion=102' app/src/main/resources/META-INF/xposed/module.prop
          grep -q '^com.android.systemui$' app/src/main/resources/META-INF/xposed/scope.list
          test ! -f app/src/main/assets/xposed_init

          ! grep -R -n -E 'de\.robv\.android\.xposed|com\.highcapable\.yukihookapi|xposedminversion|xposedmodule' app/src/main app/build.gradle gradle/libs.versions.toml
          grep -q 'chain.proceed()' app/src/main/kotlin/com/ayc/coloraod/trace/hook/TraceEngine.kt
          ! grep -R -n 'setArg(' app/src/main/kotlin/com/ayc/coloraod/trace/hook

          mkdir -p /tmp/aod-trace-signing
          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair             -keystore /tmp/aod-trace-signing/release.jks             -storepass "$PASS" -keypass "$PASS"             -alias aod_trace_release             -keyalg RSA -keysize 4096 -validity 10000             -dname "CN=ColorOS AOD Trace, O=Ayc-Gh, C=US"

          {
            echo "storeFile=/tmp/aod-trace-signing/release.jks"
            echo "storePassword=$PASS"
            echo "keyAlias=aod_trace_release"
            echo "keyPassword=$PASS"
          } > keystore.properties

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          kotlin.daemon.jvmargs=-Xmx1g
          EOF

          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=1 clean testDebugUnitTest lintRelease assembleRelease

          APK=app/build/outputs/apk/release/app-arm64-v8a-release.apk
          test -f "$APK"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"

          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/SIGNATURE_INFO.txt
          "$BT/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.ayc.coloraod.trace'" /tmp/badging.txt
          grep -q "versionCode='1'" /tmp/badging.txt
          grep -q "versionName='0.1.0'" /tmp/badging.txt

          unzip -p "$APK" META-INF/xposed/module.prop | grep -q 'targetApiVersion=102'
          unzip -p "$APK" META-INF/xposed/java_init.list | grep -q 'com.ayc.coloraod.trace.ModuleEntry'
          unzip -p "$APK" META-INF/xposed/scope.list | grep -q '^com.android.systemui$'
          ! unzip -l "$APK" | grep -q 'assets/xposed_init'

          unzip -p "$APK" 'classes*.dex' | strings > /tmp/dex-strings.txt
          grep -q 'AOD_Trace' /tmp/dex-strings.txt
          grep -q 'PanoramicAodController' /tmp/dex-strings.txt
          grep -q 'AodBlackLayout' /tmp/dex-strings.txt
          grep -q 'FIELD_DIFF' /tmp/dex-strings.txt
          grep -q 'mode=passive-read-only' /tmp/dex-strings.txt
          ! grep -q 'de.robv.android.xposed' /tmp/dex-strings.txt

          cp "$APK" /tmp/ColorOS-AOD-Trace-v0.1.0-arm64-v8a.apk
          cp tools/capture-aod-trace.sh /tmp/capture-aod-trace.sh
          cp tools/summarize-aod-trace.sh /tmp/summarize-aod-trace.sh
          sha256sum             /tmp/ColorOS-AOD-Trace-v0.1.0-arm64-v8a.apk             /tmp/capture-aod-trace.sh             /tmp/summarize-aod-trace.sh             | tee /tmp/SHA256SUMS.txt

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.1.0 --yes >/dev/null 2>&1 || true
          cat > /tmp/release-notes.md <<'EOF'
          ## ColorOS AOD Trace v0.1.0

          首个可安装的 ColorOS / OPlus AOD 全链路只读追踪版。

          ### 追踪范围
          - DozeService / DreamService
          - DozeMachine / DozeScreenState
          - AODDisplayUtil / BaseDisplayUtil / AODVirtualDozeClient
          - OplusDozeServiceExImpl
          - PanoramicAodController + 展示动画回调
          - AodBlackLayout
          - AodUpdateManager / 低光规则
          - SmoothTransitionController
          - 单击唤醒和屏下指纹触摸路径

          ### 诊断能力
          - AOD Session ID + elapsedRealtime 时间线
          - 方法 ENTER / EXIT
          - 参数、返回值和关键字段快照
          - FIELD_DIFF 字段前后变化
          - 关键调用栈
          - 基础 / 全量 / 全景 / Display / 唤醒退出五种追踪档位

          ### 安全性
          当前版本为只读诊断模块，不修改 Hook 参数/返回值，不阻止 OFF/FINISH，不修改 View 或 Doze 状态。

          ### 附带脚本
          - capture-aod-trace.sh：root/Termux 全链路日志采集
          - summarize-aod-trace.sh：自动提取 OFF / FINISH / Panoramic / Display / Wake 时间线

          这是首个诊断版本，建议作为 prerelease 使用。
          EOF

          for attempt in 1 2 3; do
            if gh release create v0.1.0               /tmp/ColorOS-AOD-Trace-v0.1.0-arm64-v8a.apk               /tmp/capture-aod-trace.sh               /tmp/summarize-aod-trace.sh               /tmp/SHA256SUMS.txt               /tmp/SIGNATURE_INFO.txt               --title "ColorOS AOD Trace v0.1.0"               --notes-file /tmp/release-notes.md               --prerelease; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
