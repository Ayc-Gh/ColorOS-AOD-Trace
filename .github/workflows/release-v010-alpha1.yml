name: Publish v0.1.0 Alpha1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v010-alpha1.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Build and verify release
        run: |
          set -eu

          grep -q "versionCode = 1" app/build.gradle
          grep -q "versionName = '0.1.0-alpha1'" app/build.gradle
          grep -q "targetApiVersion=102" app/src/main/resources/META-INF/xposed/module.prop
          grep -q '^com.android.systemui$' app/src/main/resources/META-INF/xposed/scope.list
          test -f tools/capture-aod-trace.sh
          test -f tools/summarize-aod-trace.sh
          test ! -f app/src/main/assets/xposed_init
          if grep -R -n -E "de\\.robv\\.android\\.xposed|com\\.highcapable\\.yukihookapi|xposedminversion|xposedmodule" app/src/main app/build.gradle gradle/libs.versions.toml; then
            echo "::error::Legacy Xposed marker found in source tree"
            exit 1
          fi

          mkdir -p /tmp/aod-trace-signing
          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair             -keystore /tmp/aod-trace-signing/release.jks             -storepass "$PASS"             -keypass "$PASS"             -alias trace_release             -keyalg RSA             -keysize 4096             -validity 10000             -dname "CN=ColorOS AOD Trace Alpha, O=Ayc-Gh, C=US"

          {
            echo "storeFile=/tmp/aod-trace-signing/release.jks"
            echo "storePassword=$PASS"
            echo "keyAlias=trace_release"
            echo "keyPassword=$PASS"
          } > keystore.properties

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          kotlin.daemon.jvmargs=-Xmx1g
          EOF

          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=1 clean testDebugUnitTest lintRelease assembleRelease

          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          test -n "$APK"

          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/SIGNATURE_INFO.txt
          "$BT/aapt" dump badging "$APK" | tee /tmp/badging.txt

          echo "[verify] badging version"
          if ! grep -q "versionCode='1'" /tmp/badging.txt; then
            echo "::error::APK versionCode mismatch"
            exit 1
          fi
          if ! grep -q "versionName='0.1.0-alpha1'" /tmp/badging.txt; then
            echo "::error::APK versionName mismatch"
            exit 1
          fi
          echo "[verify] badging OK"

          echo "[verify] APK file listing"
          if ! unzip -l "$APK" > /tmp/apk-list.txt; then
            echo "::error::Unable to list APK contents"
            exit 1
          fi
          grep -i 'META-INF/xposed' /tmp/apk-list.txt || true

          echo "[verify] module.prop"
          if ! unzip -p "$APK" META-INF/xposed/module.prop > /tmp/xposed-module.prop; then
            echo "::error::Unable to extract META-INF/xposed/module.prop"
            exit 1
          fi
          cat /tmp/xposed-module.prop
          if ! grep -q "targetApiVersion=102" /tmp/xposed-module.prop; then
            echo "::error::targetApiVersion=102 missing from module.prop"
            exit 1
          fi

          echo "[verify] java_init.list"
          if ! unzip -p "$APK" META-INF/xposed/java_init.list > /tmp/xposed-java-init.list; then
            echo "::error::Unable to extract META-INF/xposed/java_init.list"
            exit 1
          fi
          cat /tmp/xposed-java-init.list
          if ! grep -q "com.ayc.coloraodtrace.ModuleEntry" /tmp/xposed-java-init.list; then
            echo "::error::ModuleEntry missing from java_init.list"
            exit 1
          fi

          echo "[verify] scope.list"
          if ! unzip -p "$APK" META-INF/xposed/scope.list > /tmp/xposed-scope.list; then
            echo "::error::Unable to extract META-INF/xposed/scope.list"
            exit 1
          fi
          cat /tmp/xposed-scope.list
          if ! grep -q '^com.android.systemui$' /tmp/xposed-scope.list; then
            echo "::error::SystemUI scope missing"
            exit 1
          fi

          if grep -q "assets/xposed_init" /tmp/apk-list.txt; then
            echo "::error::Legacy assets/xposed_init found in APK"
            exit 1
          fi
          echo "[verify] Xposed metadata OK"

          echo "[verify] DEX markers"
          if ! unzip -p "$APK" 'classes*.dex' | strings > /tmp/dex-strings.txt; then
            echo "::error::Unable to extract DEX strings"
            exit 1
          fi

          check_dex() {
            pattern="$1"
            label="$2"
            if ! grep -q "$pattern" /tmp/dex-strings.txt; then
              echo "::error::Missing required DEX marker: $label ($pattern)"
              exit 1
            fi
            echo "[verify] DEX marker OK: $label"
          }

          check_dex "PanoramicAodController" "Panoramic controller runtime class"
          check_dex "AodBlackLayout" "AOD UI runtime class"
          check_dex "AODDisplayUtil" "AOD display runtime class"
          check_dex "OplusWakeUpController" "wake controller runtime class"
          check_dex "AOD_SESSION_START" "session lifecycle log marker"
          check_dex "AODT" "structured trace prefix"

          if grep -q "de.robv.android.xposed" /tmp/dex-strings.txt; then
            echo "::error::Legacy Xposed API marker found in release DEX"
            exit 1
          fi
          echo "[verify] DEX OK"

          cp "$APK" /tmp/ColorOS-AOD-Trace-v0.1.0-alpha1.apk
          cp tools/capture-aod-trace.sh /tmp/capture-aod-trace.sh
          cp tools/summarize-aod-trace.sh /tmp/summarize-aod-trace.sh
          sha256sum             /tmp/ColorOS-AOD-Trace-v0.1.0-alpha1.apk             /tmp/capture-aod-trace.sh             /tmp/summarize-aod-trace.sh | tee /tmp/SHA256SUMS.txt

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.1.0-alpha1 --yes >/dev/null 2>&1 || true

          cat > /tmp/release-notes.md <<'EOF'
          ## ColorOS AOD Trace v0.1.0 Alpha1

          第一版独立 ColorOS AOD / Doze 全链路只读追踪工具。

          ### 能力
          - Modern libxposed API 102。
          - 作用域仅 SystemUI。
          - AOD session 时间线与 elapsedMs。
          - 方法 ENTER / EXIT / THROW。
          - 参数、返回值、关键字段 before/after/diff。
          - 可选调用栈。
          - 基础 / 完整 / Panoramic / Display-Doze / Wake-Unlock 预设。
          - 深度追踪 PanoramicAodController、动画结束回调、AodBlackLayout、AODDisplayUtil、DozeMachine、指纹/唤醒链。
          - 附带 root 日志采集和摘要脚本。

          ### 安全模型
          追踪器不修改 Hook 参数和返回值，不拦截 OFF，不改变 DOZE/DOZE_SUSPEND，不阻止 DreamService.finish。

          ### 使用
          安装并在 LSPosed 中启用，作用域选择 SystemUI。将 capture-aod-trace.sh 放到 Download 后执行：

          `su -c 'sh /storage/emulated/0/Download/capture-aod-trace.sh'`

          日志输出到 `/storage/emulated/0/Documents/ColorOS-AOD-Trace/log/`。

          这是诊断 Alpha 版本，重点用于当前 ColorOS AOD 默认时长 / UI hide 链路分析。
          EOF

          gh release create v0.1.0-alpha1             /tmp/ColorOS-AOD-Trace-v0.1.0-alpha1.apk             /tmp/capture-aod-trace.sh             /tmp/summarize-aod-trace.sh             /tmp/SHA256SUMS.txt             /tmp/SIGNATURE_INFO.txt             --title "ColorOS AOD Trace v0.1.0 Alpha1"             --notes-file /tmp/release-notes.md             --prerelease
